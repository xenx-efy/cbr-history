name: Poll CBR RSS feeds

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # чтобы можно было запустить вручную из интерфейса GitHub

permissions:
  contents: write   # нужно, чтобы workflow мог коммитить в репозиторий

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Run poller
        run: python scripts/poll.py

      - name: Commit and push if changed
        run: |
          git config user.name "cbr-poll-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "poll: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push